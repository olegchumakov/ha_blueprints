blueprint:
  name: "Light: Switch (Any) + Motion Sensor (Unified Logic)"
  description: >
    A single automation for the entire logic. The switch trigger is universal —
    it supports MQTT (zigbee2mqtt), ZHA button events, Z-Wave scenes, state changes 
    of any entity, template triggers, or anything else available in the standard HA trigger editor.

      - The switch turns the light on/off and enables/disables "manual mode".
      - If the light is off, motion turns it on (unless within the N-minute 
        lockout/debounce window after manual turn-off).
      - If the light was turned on by motion (not in manual mode), it turns off 
        M minutes after motion stops.
      - If the light was turned on by the switch (manual mode), it turns off 
        K hours after the LAST detected motion. If motion is detected again 
        before the timeout expires, the timer resets automatically.
        If no motion occurs at all, the light remains on until turned off manually.

    Before using, create these helpers once via Settings -> Devices & Services -> Helpers:
      - input_boolean (manual mode flag)
      - timer (used for TWO roles sequentially: while manual mode is active, 
        it acts as a 2-hour timeout; while inactive, it acts as a 2-minute 
        sensor lockout after a manual turn-off. These roles never overlap, 
        so a single timer is sufficient)

  domain: automation

  input:
    motion_sensor:
      name: "Motion sensor"
      selector:
        entity:
          domain: binary_sensor

    light_entity:
      name: "Light"
      selector:
        entity:
          domain: light

    switch_trigger:
      name: "Switch trigger"
      description: >
        Configure this just like a regular automation trigger: MQTT topic 
        and payload (for zigbee2mqtt), ZHA button press device trigger, 
        Z-Wave JS scene, switch/button entity state change, etc. 
        You can specify multiple triggers — any of them will activate it.
      default: []
      selector:
        trigger: {}

    manual_mode_boolean:
      name: "Helper: manual mode flag (input_boolean)"
      selector:
        entity:
          domain: input_boolean

    shared_timer:
      name: "Helper: shared timer (timer)"
      description: "Used for both the 2-hour timeout and the 2-minute lockout"
      selector:
        entity:
          domain: timer

    switch_block_minutes:
      name: "Sensor lockout after manual turn-off, min"
      default: 2
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: minutes

    auto_off_minutes:
      name: "Auto mode: turn off X minutes after motion stops"
      default: 2
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: minutes

    manual_timeout:
      name: "Manual mode: turn off X duration after last motion"
      default: "02:00:00"
      selector:
        duration:

mode: queued
max: 20

triggers:
  - trigger: homeassistant
    event: start
    id: ha_started
  - entity_id: !input motion_sensor
    to: "on"
    id: motion_on
    trigger: state
  - entity_id: !input motion_sensor
    from: "on"
    to: "off"
    for:
      minutes: !input auto_off_minutes
    id: motion_off_auto_timeout
    trigger: state
  - entity_id: !input motion_sensor
    from: "on"
    to: "off"
    id: motion_off_immediate
    trigger: state
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input shared_timer
    id: shared_timer_finished
  - triggers: !input switch_trigger

conditions: []

variables:
  light_entity: !input light_entity
  motion_sensor: !input motion_sensor
  manual_mode_boolean: !input manual_mode_boolean
  shared_timer: !input shared_timer
  switch_block_minutes: !input switch_block_minutes
  manual_timeout: !input manual_timeout

actions:
  - choose:
      # --- 0. HA Restart: if manual mode was active - restore full timeout from scratch ---
      - conditions:
          - condition: trigger
            id: ha_started
          - condition: state
            entity_id: !input manual_mode_boolean
            state: "on"
          - condition: template
            value_template: "{{ is_state(light_entity, 'on') }}"
        sequence:
          - action: timer.start
            target:
              entity_id: !input shared_timer
            data:
              duration: "{{ manual_timeout }}"

      # --- 2. Motion detected ---
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: state
            entity_id: !input manual_mode_boolean
            state: "off"
          - condition: template
            value_template: "{{ is_state(light_entity, 'off') }}"
        sequence:
          - if:
              # Lockout in progress after switch turn-off -> simply reset countdown, do NOT turn on light
              - condition: template
                value_template: "{{ is_state(shared_timer, 'active') }}"
            then:
              - action: timer.cancel
                target:
                  entity_id: !input shared_timer
            else:
              # No lockout -> normal turn-on by motion
              - action: light.turn_on
                target:
                  entity_id: !input light_entity

      # --- 3. Auto mode: turn off after X minutes without motion ---
      - conditions:
          - condition: trigger
            id: motion_off_auto_timeout
          - condition: template
            value_template: "{{ is_state(light_entity, 'on') }}"
          - condition: state
            entity_id: !input manual_mode_boolean
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light_entity

      # --- 4. Motion cleared: (re)start shared timer ---
      - conditions:
          - condition: trigger
            id: motion_off_immediate
        sequence:
          - choose:
              # Manual mode & light is ON -> 2h timeout
              - conditions:
                  - condition: state
                    entity_id: !input manual_mode_boolean
                    state: "on"
                  - condition: template
                    value_template: "{{ is_state(light_entity, 'on') }}"
                sequence:
                  - action: timer.start
                    target:
                      entity_id: !input shared_timer
                    data:
                      duration: "{{ manual_timeout }}"
              # Not in manual mode & light is OFF -> sensor lockout
              - conditions:
                  - condition: state
                    entity_id: !input manual_mode_boolean
                    state: "off"
                  - condition: template
                    value_template: "{{ is_state(light_entity, 'off') }}"
                sequence:
                  - action: timer.start
                    target:
                      entity_id: !input shared_timer
                    data:
                      duration: "00:{{ '%02d' % (switch_block_minutes | int) }}:00"

      # --- 5. Shared timer finished ---
      - conditions:
          - condition: trigger
            id: shared_timer_finished
        sequence:
          - if:
              # Manual mode flag is active -> 2h timeout finished
              - condition: state
                entity_id: !input manual_mode_boolean
                state: "on"
            then:
              - if:
                  - condition: template
                    value_template: "{{ is_state(motion_sensor, 'off') }}"
                  - condition: template
                    value_template: "{{ is_state(light_entity, 'on') }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: !input light_entity
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input manual_mode_boolean

  # --- 1. Switch toggle (any trigger other than the internal IDs listed above is treated as a button press) ---
  - if:
      - condition: not
        conditions:
          - condition: trigger
            id:
              - ha_started
              - motion_on
              - motion_off_auto_timeout
              - motion_off_immediate
              - shared_timer_finished
    then:
      - if:
          - condition: template
            value_template: "{{ is_state(light_entity, 'off') }}"
        then:
          - action: light.turn_on
            target:
              entity_id: !input light_entity
          - action: input_boolean.turn_on
            target:
              entity_id: !input manual_mode_boolean
          - action: timer.cancel
            target:
              entity_id: !input shared_timer
        else:
          - action: light.turn_off
            target:
              entity_id: !input light_entity
          - action: input_boolean.turn_off
            target:
              entity_id: !input manual_mode_boolean
          - action: timer.cancel
            target:
              entity_id: !input shared_timer
          - if:
              - condition: template
                value_template: "{{ is_state(motion_sensor, 'off') }}"
            then:
              - action: timer.start
                target:
                  entity_id: !input shared_timer
                data:
                  duration: "00:{{ '%02d' % (switch_block_minutes | int) }}:00"
